name: Install verified normalized 050

on:
  push:
    branches:
      - codex/kiwi-ui-preflight-fix

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install exact-base verified 050 on clean fix branch
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=codex/kiwi-ui-050-normalize
          EXPECTED=401625e729d6dde89cdceea0e6cf1dbe9c63e64e
          cp kiwi_port/regenerate_patches.py "$RUNNER_TEMP/regenerate_patches.py"
          git fetch origin "$TARGET"
          git checkout -B "$TARGET" "origin/$TARGET"
          test "$(git rev-parse HEAD)" = "$EXPECTED" || {
            echo "Target moved; refusing to overwrite: $(git rev-parse HEAD)" >&2
            exit 1
          }
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/regenerate_patches.py" <<'PY'
          import base64
          import hashlib
          import json
          import shutil
          import sys
          import zlib
          from pathlib import Path

          repo = Path(sys.argv[1])
          regen = Path(sys.argv[2])
          payload = """"""
          patch = zlib.decompress(base64.b64decode(payload))
          want_patch = "46389b6ee7ebf4e59527108bbbd9933d8e1b140c520b7eabed377a1c66ace1d7"
          got_patch = hashlib.sha256(patch).hexdigest()
          if got_patch != want_patch:
              raise SystemExit(f"payload sha mismatch: {got_patch}")
          text = patch.decode("utf-8")
          if text.count("diff --git ") != 13:
              raise SystemExit("normalized 050 does not contain exactly 13 files")
          (repo / "kiwi_port/patches/050-night-mode-presets.patch").write_bytes(patch)
          shutil.copy2(regen, repo / "kiwi_port/regenerate_patches.py")

          hashes = {
            "chrome/android/java/src/org/chromium/chrome/browser/init/ProcessInitializationHandler.java": ("0c8ad0b606e9d119743b85e238fe997d09458c951a0504863b2ccac97da4057d", "c4b7eaa59e16d8259459f35f2d7f197e14b6080ddd0b9fb03380ef2e8598109c"),
            "chrome/browser/ui/android/night_mode/BUILD.gn": ("fea7203de919361f05ee363f2a3b82817ef0e26c5f45bff2560f01fbab26e03b", "46c25e9d2dbd16a531d284d97a5aefbbdf3117a5fcc232abbbe46ed76a7585e4"),
            "chrome/browser/ui/android/night_mode/java/res/values-ja/kiwi_night_mode.xml": (None, "1e4040029058aa0c768927a77e7a8f49ebb9e664e63f10b28bdff9a2bdbe8250"),
            "chrome/browser/ui/android/night_mode/java/res/values/kiwi_night_mode.xml": (None, "85527f3aba0a1798fe9d38fd8ea115e4cab10f0bc9479c3218e26b5c16acfb49"),
            "chrome/browser/ui/android/night_mode/java/res/xml/theme_preferences.xml": ("95c3af1a24f5ca3d0f91aaff6afc560ece832a76ea2099395df152e6446c1094", "8142f3ca862d54025ad4e100ea66d536d79861b842810f7453e6eab03571c11e"),
            "chrome/browser/ui/android/night_mode/java/src/org/chromium/chrome/browser/night_mode/settings/ThemeSettingsFragment.java": ("47e8d1336f96f3a11ce566ef022f4587f929809f2c7e2b5a8d2c3a430005e5dc", "273f69915ae3fac8fd326ebbe0c89dc93e4adf3f9f45464eaed0da2cd8f4d912"),
            "third_party/blink/renderer/platform/graphics/dark_mode_color_filter.cc": ("8f16a319ff08e062f781b27c21095361e0711a6f30281be90bb36746394f0ab0", "47bc9e79ad5b5ac44cfbe29310bab0699bde1b04724928592b088e9d06cee045"),
            "third_party/blink/renderer/platform/graphics/dark_mode_color_filter.h": ("178f6beb55420301c18770ddbb8e265082fcba3217e8248bec3c396261e60cb0", "a6c12432add83145252a207ddd30f8acb7686077f89fa28f2a83d1c8cb00a28a"),
            "third_party/blink/renderer/platform/graphics/dark_mode_filter.cc": ("49b9bea63fe3f7e41cbe9d92a6536ea522dbb0613dce816b10234472fe827e96", "bfee0222371975b47a8c88adc549bd8a44ef6bdf08c3b619224d3b4e04e8f0bd"),
            "third_party/blink/renderer/platform/graphics/dark_mode_settings.h": ("3bf45c39f890447087fd5549a78a9c8a8acfd039547de3c1674965492f31c6b6", "8ceb8a9ff030a51c4746d081723878a052d9cea3120faeb5ebc7192ce34cacc3"),
            "third_party/blink/renderer/platform/graphics/dark_mode_settings_builder.cc": ("23f8481a0b10f48f6d412a9fac0f8227a03d2e508fa0161168dde6116041fa66", "1d601c2fc7cdced06096e43ec850e592efd236494eba43113d5fe92b40ca75cc"),
            "third_party/blink/renderer/platform/graphics/dark_mode_settings_builder.h": ("217229378c7bb83b6de507fa20fc355374e622607c43e2e66e49be1671d08f33", "383112119bee8415df6c0394c25e76d0ce62d13cbf50b33152aa3253fb65a3a5"),
            "third_party/blink/renderer/platform/graphics/dark_mode_filter_test.cc": ("093682608b2ce4ad1cd23675bc80f424a91d16ae36494eae598b88b9cb997265", "0f90652a107c87cbcd133439ef50d716f31f7412545d3e6496c946f78fbc0aab"),
          }
          manifest_path = repo / "kiwi_port/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for path, (before, after) in hashes.items():
              manifest["files"][path] = {"before_sha256": before, "after_sha256": after}
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          series_path = repo / "kiwi_port/patches/series.json"
          series = json.loads(series_path.read_text(encoding="utf-8"))
          feature = next(x for x in series["features"] if x["id"] == "night-mode-presets")
          feature["sha256"] = want_patch
          series_path.write_text(json.dumps(series, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("installed normalized 050", got_patch)
          PY
          python3 -m py_compile kiwi_port/regenerate_patches.py kiwi_port/apply.py kiwi_port/test_night_mode_patch.py
          git diff --check
          git config user.name 'Titanium-Kiwi repair'
          git config user.email 'build@example.invalid'
          git add kiwi_port/patches/050-night-mode-presets.patch kiwi_port/patches/series.json kiwi_port/manifest.json kiwi_port/regenerate_patches.py
          git commit -m 'Rebuild Night mode patch from exact Chromium 152 base'
          git push origin "HEAD:$TARGET"
