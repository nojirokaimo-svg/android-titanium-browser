name: Chromium checkpoint build stage
description: Prepare the pinned tree, resume a cached Ninja output directory, and compile within a safe job budget.

inputs:
  restore-key:
    description: Exact cache key produced by the previous stage; empty for stage 1.
    required: false
    default: ""
  save-key:
    description: Cache key to save when the APK is not finished yet.
    required: true
  final-cache-key:
    description: Immutable reusable out/Default key saved when this stage produces the APK.
    required: false
    default: ""
  require-restore:
    description: Refuse to compile if restore-key is unavailable; use for Night mode incremental builds.
    required: false
    default: "false"
  titanium-commit:
    required: false
    default: "80ffcdf1cebe51cddc593f571a6f26c3374aea2e"
  vanadium-commit:
    required: false
    default: "150a27e23302cc265baf8a7fb7c0f0112bddf2fd"
  chromium-commit:
    required: false
    default: "506c834ecceaa943c5f41e6cfe7f68acb5c45346"
  chromium-version:
    required: false
    default: "152.0.7977.64"
  patch-mode:
    description: strict for pinned builds; best-effort for a newly resolved upstream.
    required: false
    default: strict

outputs:
  done:
    description: Whether this stage produced and verified the APK.
    value: ${{ steps.result.outputs.done }}

runs:
  using: composite
  steps:
    - name: Free runner disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
        sudo docker system prune --all --force --volumes || true
        df -h

    - name: Verify patch applicator
      shell: bash
      run: python3 -m py_compile kiwi_port/apply.py

    - name: Prepare pinned and patched Chromium tree
      shell: bash
      env:
        KIWI_BUILD_PHASE: prepare
        KIWI_PATCH_MODE: ${{ inputs.patch-mode }}
        KIWI_PATCH_REPORT: ${{ github.workspace }}/output/kiwi-patch-report.md
        TITANIUM_COMMIT: ${{ inputs.titanium-commit }}
        VANADIUM_COMMIT: ${{ inputs.vanadium-commit }}
        CHROMIUM_COMMIT: ${{ inputs.chromium-commit }}
        CHROMIUM_VERSION: ${{ inputs.chromium-version }}
      run: ./build_kiwi_ui_arm64.sh

    - name: Restore previous compile checkpoint
      id: restore
      if: inputs.restore-key != ''
      uses: actions/cache/restore@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.restore-key }}
        fail-on-cache-miss: true

    - name: Preserve Ninja history and age the identical fresh source tree
      if: inputs.restore-key != ''
      shell: bash
      run: |
        # Never touch restored outputs: .ninja_log records their exact mtimes.
        # A fresh checkout makes identical sources look newer than the cached
        # outputs, so age only source-side files to keep Ninja's history valid.
        find work/titanium/chromium/src \
          -path '*/.git' -prune -o \
          -path '*/out' -prune -o \
          -type f -exec touch -d '@946684800' {} +
        # This source changed relative to the restored checkpoint. Keep it newer.
        touch work/titanium/chromium/src/chrome/browser/password_manager/android/java/src/org/chromium/chrome/browser/password_manager/PasswordManagerHelper.java

    - name: Continue arm64 APK compilation for at most 210 minutes
      id: compile
      shell: bash
      env:
        KIWI_BUILD_PHASE: compile
        KIWI_BUILD_BUDGET_MINUTES: "210"
        KIWI_INCREMENTAL_NINJA: ${{ inputs.restore-key != '' }}
        CHROMIUM_VERSION: ${{ inputs.chromium-version }}
      run: |
        mkdir -p output
        # Fail on Java/Lint errors before spending hours on native compilation.
        if [[ -f work/titanium/chromium/src/out/Default/.ninja_log ]]; then
          timeout --signal=INT --kill-after=2m 30m env INVOKED_BY_BUILD_SERVER=1 /usr/bin/ninja \
            -C work/titanium/chromium/src/out/Default -j 4 \
            obj/chrome/android/chrome_public_apk__lint/build.lint.stamp 2>&1 | tee output/lint.log
        fi
        ./build_kiwi_ui_arm64.sh 2>&1 | tee output/build.log

    - name: Record result and checkpoint size
      id: result
      if: always()
      shell: bash
      run: |
        du -sh work/titanium/chromium/src/out/Default || true
        if [[ -f output/BUILD_COMPLETE ]]; then
          echo "done=true" >> "$GITHUB_OUTPUT"
        else
          echo "done=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save compile checkpoint
      if: ${{ always() && steps.compile.outcome != 'skipped' && steps.result.outputs.done != 'true' && hashFiles('work/titanium/chromium/src/out/Default/.ninja_log') != '' }}
      uses: actions/cache/save@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.save-key }}

    - name: Save completed out/Default for later incremental UI builds
      if: steps.compile.outcome == 'success' && steps.result.outputs.done == 'true' && inputs.final-cache-key != ''
      uses: actions/cache/save@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.final-cache-key }}

    - name: Upload APK and checksum
      if: steps.result.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Titanium-Kiwi-core-${{ inputs.chromium-version }}-arm64
        path: |
          output/Titanium-Kiwi-core-*-arm64-v8a.apk
          output/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Titanium-Kiwi-core-failure-${{ inputs.save-key }}
        path: |
          work/titanium/chromium/src/out/Default/args.gn
          work/titanium/chromium/src/out/Default/*.log
          output/*.log
          output/kiwi-patch-report.*
          work/titanium/chromium/src/**/*.rej
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
